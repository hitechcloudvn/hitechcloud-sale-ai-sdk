[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hitechcloud-sale-ai"
version = "1.0.0"
description = "Official HiTechCloud Sale AI SDK for Python - multi-channel sales chatbot API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "HiTechCloud Vietnam", email = "support@hitechcloud.vn"}]
keywords = ["hitechcloud", "sale-ai", "chatbot", "messenger", "zalo", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.28.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "responses>=0.23"]

[project.urls]
Homepage = "https://github.com/hitechcloud-vietnam/hitechcloud-sale-ai-sdk"
Documentation = "https://developers.hitechcloud.vn/tai-lieu/sale-ai"
Repository = "https://github.com/hitechcloud-vietnam/hitechcloud-sale-ai-sdk"
Issues = "https://github.com/hitechcloud-vietnam/hitechcloud-sale-ai-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hitechcloud_sale_ai*"]
